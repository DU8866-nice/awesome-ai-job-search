    en_intro: "Internship, new-grad and entry-level lists you can read right on GitHub. Most are maintained by job-product companies and promote their own products on the page."
    static: true
    items:
      - repo: SimplifyJobs/Summer2027-Internships
        zh: "2027 年暑期实习清单：软件、数据科学、AI、量化、产品和硬件方向，美国为主。"
        en: "Summer 2027 internships in software, data science, AI, quant, product and hardware, mostly US."
      - repo: speedyapply/2027-SWE-College-Jobs
        zh: "2027 届软件工程实习和应届职位清单，每日更新。"
        en: "2027 software engineering internship and new-grad jobs, updated daily."
      - repo: speedyapply/2027-AI-College-Jobs
        zh: "2027 届 AI / 机器学习实习和应届职位清单，每日更新。"
        en: "2027 AI/ML internship and new-grad jobs, updated daily."
      - repo: LorenzoLaCorte/european-tech-internships-2026
        zh: "欧洲科技实习、应届职位和研究机会，定期更新。"
        en: "European tech internships, new-grad roles and research opportunities, updated regularly."
      - repo: hanzili/canada_sde_junior_new_grad_position
        zh: "加拿大计算机应届和初级职位，每日更新。"
        en: "Canadian CS new-grad and junior jobs, updated daily."
      - repo: workopia/Australia-Graduate-Jobs
        zh: "澳大利亚毕业生项目、初级职位和实习，按行业分类，每日更新。"
        en: "Australian graduate schemes, entry-level roles and internships by sector, updated daily."
      - repo: workopia/Australia-Casual-Part-Time-Jobs
        zh: "澳大利亚临时工、兼职和圣诞季兼职职位，每日更新。"
        en: "Australian casual, part-time and Christmas casual jobs, updated daily."
      - repo: namewyf/Campus2026
        zh: "互联网校招和实习信息汇总，社区共同维护。"
        en: "Community-maintained campus recruiting and internship information for Chinese internet companies."
        cn: true

  - id: resume
    zh: "写简历"
    en: "Build your resume"
    zh_intro: "在线编辑器、把简历当代码写的工具，以及经典模板。"
    en_intro: "Online editors, resume-as-code tools and classic templates."
    items:
      - repo: reactive-resume/reactive-resume
        zh: "免费开源的简历制作工具：写简历和求职信、检查内容、跟踪投递，可导出 PDF、Word、Markdown 或 JSON，也能部署在自己的服务器上。"
        en: "A free, open-source resume builder for resumes and cover letters, with checks and application tracking; exports PDF, Word, Markdown or JSON and can run on your own infrastructure."
        selfhost: true
      - repo: rendercv/rendercv
        zh: "面向学术和工程师的简历工具：用 YAML 写内容，一条命令生成排版精良的 PDF，方便用 Git 管理版本。"
        en: "A resume builder for academics and engineers: write your CV as YAML and render a well-typeset PDF with one command, easy to version-control."
      - repo: JOYCEQL/magic-resume
        zh: "现代化的在线简历编辑器：实时预览、自定义主题、导出 PDF，数据自动保存在本地。"
        en: "A modern online resume editor with live preview, custom themes, PDF export and local auto-save."
        cn: true
      - repo: LingyiChen-AI/JadeAI
        zh: "AI 简历生成器：拖拽编辑、AI 优化、50 套模板、多格式导出；桌面客户端支持 macOS 和 Windows，无需账号，数据在本机。"
        en: "An AI resume builder with drag-and-drop editing, AI optimization, 50 templates and multi-format export; the macOS and Windows desktop app needs no account and keeps data local."
        selfhost: true
        cn: true
      - repo: magicapple123/ResumeForge
        zh: "简历通：本地优先的 AI 简历工作台，无需注册登录，数据只保存在本机。"
        en: "ResumeForge, a local-first AI resume workbench with no sign-up; data stays on your machine."
        selfhost: true
        cn: true
      - repo: yamlresume/yamlresume
        zh: "把简历当代码：用 YAML 写简历，生成专业排版的 PDF。"
        en: "Resumes as code: write your resume in YAML and get a professionally typeset PDF."
      - repo: saadq/resumake.io
        zh: "免费开源的 LaTeX 简历生成网站：没有广告，不用注册，简历保存在你自己的浏览器里。"
        en: "A free, open-source LaTeX resume generator with no ads or accounts; your resume is saved in your own browser."
      - repo: Arman19941113/dnd-resume
        zh: "本地优先的拖拽式简历制作工具，直接在浏览器里编辑并导出 PDF。"
        en: "A local-first drag-and-drop resume builder that edits and exports PDF right in the browser."
        cn: true
      - repo: BingyanStudio/LapisCV
        zh: "用 Markdown 写简历：在 VS Code、Typora 或 Obsidian 里套用主题即可。"
        en: "Write your resume in Markdown with a theme for VS Code, Typora or Obsidian."
        cn: true
      - repo: yunanwg/brilliant-CV
        zh: "基于 Typst 的模块化简历模板，一套资料可以切换成针对不同职位或语言的版本。"
        en: "A modular CV template for Typst; one set of data can switch between versions for different jobs or languages."
      - repo: posquit0/Awesome-CV
        zh: "经典的 LaTeX 简历和求职信模板。"
        en: "The classic LaTeX template for resumes and cover letters."
      - repo: dyweb/awesome-resume-for-chinese
        zh: "适合中文的简历模板合集（LaTeX、HTML 等）。"
        en: "A collection of resume templates that work well for Chinese (LaTeX, HTML and more)."
        cn: true
      - repo: youngyangyang04/Markdown-Resume-Template
        zh: "程序员向的 Markdown 简历模板，简单明了，fork 后直接改。"
        en: "A plain Markdown resume template for programmers; fork and edit."
        cn: true
      - repo: Nutlope/self.so
        zh: "上传简历 PDF，用 AI 生成个人主页。"
        en: "Upload your resume PDF and get a personal site generated with AI."

  - id: match
    zh: "简历和职位匹配"
    en: "Match your resume to the job"
    zh_intro: "投之前先对照职位描述检查简历：缺哪些要求、哪些关键词没出现、哪些句子可以改。"
    en_intro: "Check your resume against the job description before you apply: which requirements are missing, which keywords never appear and which lines to rewrite."
    items:
      - repo: srbhr/Resume-Matcher
        zh: "免费开源、可自己部署的 AI 简历工具：根据每一份职位描述定制简历，支持多种大模型。"
        en: "A free, open-source, self-hosted AI resume tool that tailors your resume to each job description, with many LLMs supported."
        selfhost: true
      - repo: DU8866-nice/jobfit
        zh: "JobFit：对照职位描述逐条核对简历，每个“满足”都附简历原句作证据，修改建议只改你已有的句子，支持中英文。"
        en: "JobFit checks your resume against a job description requirement by requirement; every match quotes your resume as evidence, and suggestions only rewrite lines you already have. Chinese and English."
        cn: true
        note_zh: "本清单作者的项目"
        note_en: "Made by the author of this list"
      - repo: interviewstreet/hiring-agent
        zh: "招聘方视角的简历打分 Agent：从 PDF 提取结构化信息，结合 GitHub 数据给出可解释的评分。想知道 AI 怎么筛简历可以看它。"
        en: "A resume-scoring agent from the hiring side: extracts structured data from PDFs, adds GitHub signals and gives an explainable score. Worth reading to see how AI screens resumes."

  - id: apply
    zh: "帮你填申请表（最后由你提交）"
    en: "Fill application forms (you submit)"
    zh_intro: "网申最费时间的是重复填表。这些工具帮你填，停在提交之前。"
    en_intro: "The slow part of applying is retyping the same details. These tools fill the form and stop before submitting."
    items:
      - repo: AhmadHassan-BTed/FormFilla
        zh: "本地优先的浏览器扩展：用本地保存的个人资料填 Workday、Greenhouse、Lever 等申请系统的表单，全程不联网、不用大模型。"
        en: "A local-first browser extension that fills Workday, Greenhouse, Lever and other application forms from locally stored profile data, with no network calls and no LLM."
        selfhost: true
      - repo: qbeka/jev-job-search
        zh: "找软件实习和应届职位，在你能看着的 Chrome 窗口里填好申请表，逐项回读页面上的答案，只发送你批准的内容。"
        en: "Finds software internships and new-grad jobs, fills each application in a Chrome window you can watch, reads every answer back from the page and sends only what you approve."
        agent: true
      - repo: aurostars/Job-Application-Helper
        zh: "秋招网申助手：Chrome 和 Edge 扩展，集中管理求职资料，识别招聘表单并快速填入个人信息、教育经历和项目经历，带投递记录。"
        en: "A Chrome and Edge extension for campus applications in China: keeps your details in one place, detects application forms and fills personal, education and project fields, with an application log."

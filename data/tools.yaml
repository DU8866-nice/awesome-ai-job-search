# Source of truth for README.md and README.en.md.
# Edit this file, then run: python scripts/build_readme.py
# Each entry needs `repo`, `zh` and `en`. Keep descriptions to one or two sentences.
# Optional flags (only when the project's README says so):
#   agent: true      runs inside an AI coding agent (Claude Code, Codex...) as a skill, plugin or CLI
#   selfhost: true   runs on your own computer or server, your data stays with you
#   cn: true         Chinese-friendly: Chinese UI or docs, or built for the Chinese job market
#   auto: true       automates job sites (scraping or applying); accounts can get restricted
#   note_zh / note_en: one short caveat shown under the entry
# Categories with `static: true` hold reference material, so they don't get the stale mark.

categories:
  - id: pipeline
    zh: "一站式求职助手"
    en: "All-in-one job search assistants"
    zh_intro: "把找职位、评估匹配、改简历、写求职信和跟踪投递放在一起的工具。这里收录的都不替你点“提交”，最后一步由你决定。"
    en_intro: "Tools that combine finding jobs, scoring fit, tailoring resumes, drafting cover letters and tracking applications. None of these press Submit for you; the last step stays yours."
    items:
      - repo: career-ops-hq/career-ops
        zh: "开源的 AI 求职 Agent：贴一个职位进去，在你自己的电脑上判断职位是否还在招、和你匹不匹配，再定制简历、起草回答，最后由你点提交。"
        en: "An open-source AI job search agent: paste a job and it checks, on your machine, whether the role is still open and whether it fits, then tailors your CV and drafts answers. You press Submit."
        agent: true
      - repo: ai-job-search-dev/ai-job-search
        zh: "建在 Claude Code 上的求职框架：fork 后填好个人档案，让 Claude 评估职位、定制简历、写求职信并帮你准备面试。"
        en: "A job application framework built on Claude Code: fork it, fill in your profile, and let Claude evaluate postings, tailor your CV, write cover letters and prepare you for interviews."
        agent: true
      - repo: AienTech/dossier
        zh: "部署在自己服务器上的求职工具：一份个人档案，为每个职位生成只用档案事实的定制简历和求职信，并跟踪每次投递。"
        en: "Your job search on your own server: one profile, a tailored resume and cover letter for every job that only use facts from your profile, and every application tracked."
        selfhost: true
        note_zh: "可用 Ollama、LM Studio 本地模型，也可接云端模型"
        note_en: "Works with local models through Ollama or LM Studio, or a hosted one"
      - repo: DaKheera47/job-ops
        zh: "JobOps：一个页面搜 LinkedIn、Indeed、Glassdoor 等十多个招聘网站，为每个职位改写简历、打匹配分、查签证担保情况，并跟踪所有投递。"
        en: "JobOps searches LinkedIn, Indeed, Glassdoor and 10+ boards from one screen, rewrites your CV per role, scores fit, checks visa sponsorship and tracks every application."
        selfhost: true
        note_zh: "作者明确不做自动投递，每个职位仍由你自己申请"
        note_en: "Deliberately has no auto-apply; you still apply to every job yourself"
      - repo: vasu-devs/JustHireMe
        zh: "本地优先的求职桌面工作台：抓取职位、按匹配度排序、生成定制的申请材料，提供 Windows、macOS 和 Linux 安装包。"
        en: "A local-first desktop workbench that scrapes roles, ranks fit and generates tailored application materials, with installers for Windows, macOS and Linux."
        selfhost: true
      - repo: Gsync/jobsync
        zh: "自己部署的求职助手：跟踪每次投递，AI 审阅简历、匹配职位并自动发现新职位，可用 Ollama 本地模型，带 MCP 服务。"
        en: "A self-hosted job search assistant that tracks applications, reviews resumes with AI, matches jobs and discovers new openings, with local AI through Ollama and an MCP server."
        selfhost: true
      - repo: vesaias/JobNavigator
        zh: "自己部署、支持多账号的求职自动化：抓取公司招聘页和聚合站，用大模型给职位打分、定制简历和求职信，Telegram 提醒，一家人可以共用一套。"
        en: "Self-hosted, multi-account job-hunt automation: scrapes career pages and aggregators, scores jobs with an LLM, tailors resumes and cover letters and sends Telegram alerts; one install can serve a household."
        selfhost: true
      - repo: tarunlnmiit/autopilot-jobhunt
        zh: "每晚扫描 130 多个公司招聘页，用大模型按你的简历打分，把最匹配的职位发到 Telegram，并按需起草定制简历和求职信。"
        en: "Scans 130+ company careers pages nightly, scores each role against your resume with an LLM, sends top matches on Telegram and drafts a tailored resume and cover letter on demand."
        note_zh: "只起草，不投递"
        note_en: "Drafts only, never applies"
      - repo: offercontext/offerPilot
        zh: "OfferPilot：开源、本地优先的求职 Agent 工作台，把投递、简历、面试和 Offer 放在一起；不会自动投递，也不会替你联系招聘方。"
        en: "OfferPilot, an open-source, local-first job search agent workbench for applications, resumes, interviews and offers; it never auto-applies or contacts recruiters for you."
        selfhost: true
        cn: true
        note_zh: "基础投递记录不需要 AI；使用 AI 时需要接自己的模型服务"
        note_en: "Basic tracking needs no AI; AI features use your own model service"
      - repo: Chozzc/Lujie-Careerkit
        zh: "录阶：面向实习、校招的求职 Agent 工作台，覆盖简历编辑、JD 匹配、投递跟进、模拟面试和复盘。"
        en: "LuJie CareerKit, an agent workbench for internships and campus hiring that covers resume editing, JD matching, application follow-up, mock interviews and reviews."
        cn: true
      - repo: low-hands/MyCareer
        zh: "跑在自己电脑上的 AI 求职助手：找岗位、看匹配、改简历、练面试、管投递，数据存在本机 SQLite；每条“符合”都引用简历原文。"
        en: "An AI job search assistant on your own computer for finding roles, checking fit, editing resumes, practising interviews and tracking applications, stored in local SQLite; every match quotes your resume."
        selfhost: true
        cn: true
      - repo: DanielPan12/JobHuntBot
        zh: "由 Agent 带着走的求职投递流程加本地进度看板，适用于 Claude Code、Codex、Cursor 等；不是一键海投，最终提交需要你授权。"
        en: "An agent-led application workflow with a local progress dashboard for Claude Code, Codex, Cursor and others; not a one-click auto-apply bot, and final submission needs your authorization."
        agent: true
        cn: true
      - repo: shengjidaguai-china/BossHunter
        zh: "国内招聘平台的求职 Agent：本地完成岗位采集、AI 评分、定制简历和回复监测，所有投递必须先经人工确认。"
        en: "A job search agent for Chinese hiring platforms: collects roles, scores them with AI, tailors resumes and monitors replies locally; every application needs your confirmation first."
        selfhost: true
        cn: true
        auto: true
        note_zh: "作者提示自动化操作招聘平台有账号受限或封禁风险；许可证为非商业"
        note_en: "The author warns that automating hiring platforms can get accounts restricted; non-commercial license"

  - id: skills
    zh: "求职 Skill：装进 Claude Code、Codex 就能用"
    en: "Job search skills for Claude Code and Codex"
    zh_intro: "不用部署，把 skill 装进你已经在用的 AI 助手，用对话完成改简历、分析 JD 和准备面试。"
    en_intro: "Nothing to deploy: install a skill in the AI agent you already use and handle resumes, job descriptions and interview prep in conversation."
    items:
      - repo: Hisn00w/ASu-skills
        zh: "中文求职工作流插件：九个入口覆盖开源贡献、简历提升、简历制作、岗位匹配、投递填写、面试准备和校招进度管理。"
        en: "A Chinese job-hunting workflow plugin with nine entry points, from open-source contribution and resume work to job matching, application filling, interview prep and campus-hiring tracking."
        agent: true
        cn: true
      - repo: Paramchoudhary/ResumeSkills
        zh: "一组面向简历优化、求职申请和职业发展的 AI Agent skill，包括 ATS 优化、要点改写和面试准备。"
        en: "A collection of AI agent skills for resume optimization, job applications and career development, including ATS checks, bullet rewriting and interview prep."
        agent: true
      - repo: LiuMengxuan04/shushu-internship-tool
        zh: "鼠鼠实习妙妙工具：把岗位描述变成项目，把项目变成简历，把简历变成面试准备，适合零经验或经验少的计算机方向同学。"
        en: "Turns a job description into a project, the project into a resume and the resume into interview prep, for CS students with little or no experience."
        agent: true
        cn: true
      - repo: agentenatalie/get-job.skill
        zh: "实习.skill：从岗位调研、简历改写到分轮次面试准备，把真实背景翻译成面试官想要的语言。"
        en: "A full job-hunt skill: role research, resume rewriting and round-by-round interview prep that puts your real background into the interviewer's language."
        agent: true
        cn: true
      - repo: yanliudesign/offer-toolkit-skill
        zh: "六个求职工具打包成一个 skill 包：找机会、解码 JD、改简历、准备行为面试、对比 Offer 和谈薪，可以整包用也可以单独用。"
        en: "Six job-hunt tools in one skill bundle: job discovery, JD decoding, resume building, behavioral interview prep, offer comparison and salary negotiation, usable together or separately."
        agent: true
        cn: true
      - repo: weeelin98/ResumeDom
        zh: "面向美国科技岗位、以事实证据为核心的 Codex 简历 skill：评估、修改、按职位定制并输出可编辑的 LaTeX，绝不虚构经历。"
        en: "An evidence-first Codex skill for US tech resumes: review, rewrite, tailor to a job and return editable LaTeX without inventing experience."
        agent: true
        cn: true
      - repo: kkw114514-lang/campus-job-application-workflow
        zh: "给能操作浏览器的 AI 助手用的校招网申模板：岗位可投性核实、网申填写、提交核验和记录。"
        en: "A campus-recruiting application template for browser-capable AI agents: checks eligibility, fills forms, verifies submissions and keeps records."
        agent: true
        cn: true
      - repo: lijiaqi-AI-Product-Manager/job_radar
        zh: "给 AI 助手加的找工作技能：用自然语言查中国校招、实习、社招和招聘日历，返回岗位要求和来源链接，支持 Skill 和 MCP。"
        en: "A job search skill for AI assistants: ask in plain language about campus, intern and experienced roles and hiring calendars in China, with requirements and source links; Skill and MCP."
        agent: true
        cn: true
      - repo: guzhezao/qiuzhao
        zh: "国内校招求职 skill：岗位筛选、JD 评分、简历定制、表单预填和本地投递看板；不编造经历，不绕验证码，不在未确认时提交。"
        en: "A campus-hiring skill for China: role filtering, JD scoring, resume tailoring, form pre-filling and a local dashboard; no invented experience, no CAPTCHA bypass, no unconfirmed submissions."
        agent: true
        cn: true

  - id: find
    zh: "找职位：搜索和聚合"
    en: "Find jobs: search and aggregation"
    zh_intro: ""
    en_intro: ""
    items:
      - repo: strelov1/freehire
        zh: "面向求职者的开源职位搜索引擎：职位直接来自公司招聘页，没有猎头转发和失效链接，人和 Agent 都能用，提供 API。"
        en: "An open-source job search engine for job seekers: postings come straight from company career pages, with no recruiter reposts or dead links, for you and your agent, with an API."
      - repo: speedyapply/JobSpy
        zh: "职位抓取库：同时抓 LinkedIn、Indeed、Glassdoor、ZipRecruiter 等网站，汇总成一张表，很多求职工具的底层都用它。"
        en: "A job scraping library that pulls LinkedIn, Indeed, Glassdoor, ZipRecruiter and more at once into one dataframe; many job tools build on it."
        auto: true
      - repo: pinloop-ai/pinloop-cli
        zh: "给 AI 编程助手用的命令行职位库：每月汇集全球数百万白领职位，可以保存你的简历和偏好，逐条判断职位是否适合你。"
        en: "A job board for your coding agent, run from the terminal: millions of white-collar postings a month worldwide, judged against your resume and preferences."
        agent: true
        note_zh: "命令连接 Pinloop 的服务器，需要注册账号"
        note_en: "Commands talk to Pinloop's servers and need an account"
      - repo: can4hou6joeng4/boss-agent-cli
        zh: "面向真人和 AI Agent 的国内招聘平台命令行：职位搜索、福利筛选、候选清单，输出结构化 JSON。"
        en: "A CLI for a Chinese hiring platform, for people and AI agents: job search, benefits filtering and shortlists with structured JSON output."
        agent: true
        cn: true
        auto: true

